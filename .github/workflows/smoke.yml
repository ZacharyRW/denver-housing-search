name: smoke

# No test suite in this repo yet. This exists so Dependabot PRs get validated:
# it proves the pinned dependencies still install and every scraper module
# still imports against them.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q scraper

      - name: Import every scraper module
        # Catches removed/renamed APIs in requests, lxml, bs4 and playwright
        # that only surface at import time.
        run: |
          python - <<'PY'
          import importlib, pkgutil
          import scraper

          for mod in pkgutil.walk_packages(scraper.__path__, "scraper."):
              importlib.import_module(mod.name)
              print("ok", mod.name)
          PY

      - name: Load config
        run: python -c "from scraper.common import load_config; load_config(); print('config ok')"
